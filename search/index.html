  <section class="container page">

  <style>
    .search-container {
      margin: 2rem 0;
      display: flex;
      gap: 1rem;
    }
    
    #search-input {
      flex: 1;
      padding: 1rem;
      border: 1px solid var(--border-color);

      min-height: 50px;
    }
    
    #search-button {
      padding: 0.75rem 1.5rem;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    
    #search-button:hover {
      opacity: 0.8;
    }
    
    .search-result {
      margin: 1.5rem 0;
      padding: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
    
    .search-result h3 {
      margin: 0 0 0.5rem 0;
    }
    
    .search-result h3 a {
      color: var(--accent-color);
      text-decoration: none;
    }
    
    .search-result h3 a:hover {
      text-decoration: underline;
    }
    
    .search-result-meta {
      font-size: 1rem;
      color: var(--secondary-color);
      margin-bottom: 0.5rem;
    }
    
    .search-result-excerpt {
      line-height: 1.6;
      font-size: 1.1rem;
    }
    
    .search-highlight {
      background-color: yellow;
      font-weight: bold;
    }
  </style>

  <script>
    let searchIndex = [];
    
    
    fetch('/index.json')
      .then(response => response.json())
      .then(data => {
        searchIndex = data;
      })
      .catch(error => {
        console.error('Error loading search index:', error);
      });
    
    function performSearch(query) {
      if (!query.trim()) {
        document.getElementById('search-results').innerHTML = '<p>请输入搜索关键词</p>';
        return;
      }
      
      const results = searchIndex.filter(item => {
        const searchText = (
          item.title + ' ' + 
          item.content + ' ' + 
          (item.tags || []).join(' ') + ' ' + 
          (item.categories || []).join(' ') + ' ' + 
          (item.series || []).join(' ')
        ).toLowerCase();
        
        return searchText.includes(query.toLowerCase());
      });
      
      displayResults(results, query);
    }
    
    function displayResults(results, query) {
      const resultsContainer = document.getElementById('search-results');
      
      if (results.length === 0) {
        resultsContainer.innerHTML = '<p>没有找到相关结果</p>';
        return;
      }
      
      let html = `<p>找到 ${results.length} 个结果：</p>`;
      
      results.forEach(result => {
        const excerpt = getExcerpt(result.content, query);
        const tags = result.tags ? result.tags.join(', ') : '';
        const categories = result.categories ? result.categories.join(', ') : '';
        const series = result.series ? result.series.join(', ') : '';
        
        html += `
          <div class="search-result">
            <h3><a href="${result.permalink}">${highlightText(result.title, query)}</a></h3>
            <div class="search-result-meta">
              ${result.date ? `发布于: ${result.date}` : ''}
              ${tags ? ` | 标签: ${highlightText(tags, query)}` : ''}
              ${categories ? ` | 分类: ${highlightText(categories, query)}` : ''}
              ${series ? ` | 系列: ${highlightText(series, query)}` : ''}
            </div>
            <div class="search-result-excerpt">${excerpt}</div>
          </div>
        `;
      });
      
      resultsContainer.innerHTML = html;
    }
    
    function getExcerpt(content, query) {
      const maxLength = 200;
      const queryIndex = content.toLowerCase().indexOf(query.toLowerCase());
      
      if (queryIndex === -1) {
        return highlightText(content.substring(0, maxLength) + '...', query);
      }
      
      const start = Math.max(0, queryIndex - 50);
      const end = Math.min(content.length, start + maxLength);
      
      let excerpt = content.substring(start, end);
      if (start > 0) excerpt = '...' + excerpt;
      if (end < content.length) excerpt = excerpt + '...';
      
      return highlightText(excerpt, query);
    }
    
    function highlightText(text, query) {
      if (!query.trim()) return text;
      
      const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return text.replace(regex, '<span class="search-highlight">$1</span>');
    }
    
    
    document.getElementById('search-button').addEventListener('click', () => {
      const query = document.getElementById('search-input').value;
      performSearch(query);
    });
    
    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const query = document.getElementById('search-input').value;
        performSearch(query);
      }
    });
    
    
    const urlParams = new URLSearchParams(window.location.search);
    const queryParam = urlParams.get('q');
    if (queryParam) {
      document.getElementById('search-input').value = queryParam;
      performSearch(queryParam);
    }
  </script>
